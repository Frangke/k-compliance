name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kcompliance
          POSTGRES_PASSWORD: kcompliance-ci-pass
          POSTGRES_DB: kcompliance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kcompliance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://kcompliance:kcompliance-ci-pass@localhost:5432/kcompliance
      DATABASE_URL_SYNC: postgresql://kcompliance:kcompliance-ci-pass@localhost:5432/kcompliance
      JWT_SECRET_KEY: ci-secret-not-for-production
      ENCRYPTION_KEY: ci-encryption-key-32-bytes-long!!
      APP_ENV: test
      S3_BUCKET_NAME: k-compliance-ci
      S3_REGION: ap-northeast-2
      TEST_ADMIN_USERNAME: admin
      TEST_ADMIN_PASSWORD: Admin1234!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system libmagic
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install backend deps
        run: |
          pip install -r backend/requirements.txt
          pip install ruff

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: Alembic upgrade (CI DB)
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Seed ISMS-P items (pytest assessments needs them)
        working-directory: backend
        run: python -m app.seeds.load

      - name: Seed admin user (pytest auth needs it)
        working-directory: backend
        run: |
          python -c "
          import asyncio
          from app.database import async_session
          from app.models.user import User
          from passlib.context import CryptContext
          pwd = CryptContext(schemes=['bcrypt'])
          async def main():
              async with async_session() as db:
                  db.add(User(
                      username='admin', name='관리자', email='admin@ci.local',
                      password_hash=pwd.hash('Admin1234!'), role='cpo', is_active=True,
                  ))
                  await db.commit()
          asyncio.run(main())
          "

      - name: pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: prettier --check
        run: npx prettier --check "src/**/*.{ts,tsx,json,css}"
